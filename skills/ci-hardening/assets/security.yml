name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@REPLACE_WITH_FULL_SHA # vX.Y.Z
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@REPLACE_WITH_FULL_SHA # vX
        with:
          languages: javascript-typescript
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@REPLACE_WITH_FULL_SHA # vX

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@REPLACE_WITH_FULL_SHA # vX.Y.Z
        with:
          persist-credentials: false
      - name: Review dependency changes
        uses: actions/dependency-review-action@REPLACE_WITH_FULL_SHA # vX.Y.Z
        with:
          fail-on-severity: high

  production-audit:
    name: Production Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@REPLACE_WITH_FULL_SHA # vX.Y.Z
        with:
          persist-credentials: false
      - name: Prepare
        uses: ./.github/actions/prepare
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
